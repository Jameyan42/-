tatus==="已批准"&&i.month===(n?.date||r).slice(0,7));let s='<option value="">不关联事前申请</option>'+a.map(i=>`<option value="${ke(i.id)}" ${n?.requestId===i.id?"selected":""}>${ke(i.name)} · 可关联 ${dn(Lt(i,t.filter(l=>l.id!==n?.id)).remaining)}</option>`).join("");return n?.requestId&&!a.some(i=>i.id===n.requestId)&&(s+=`<option selected value="${ke(n.requestId)}">原关联申请当前不可提交，请更换或取消关联</option>`),`<label>关联费用申请（可选）<select name="requestId">${s}</select><small>可选本月已批准的申请；选择时同步费用类型。申请上限为硬校验，部门预算仍是软预警。</small></label>`}const Bi={员工:[["报销提交","报销管理","使用提供的虚构样票提交一笔 268.50 元报销，并说明用途。","记录首次模型加载、字段修正和提交总时间。"],["纠错与续填","报销管理","找到待审批的单据并修正错误，另存一笔未填完的报销供下次继续。","区分独立完成、提示后完成和未完成。"]],主管:[["正常审批","审批中心","找到待你处理的正常单据，查看依据后处理。","观察能否理解下一处理角色。"],["要求补充","审批中心","一笔报销说明不足，请让员工补充，并找到处理记录。","不要提前告诉参与者退回按钮的位置。"]],财务:[["异常票据","发票台账","找出疑似重复号码，说出风险原因和下一步操作。","记录原话，不把“识别重复”当作发票验真。"],["付款与预算","预算管理","解释在途占用与实际支出，完成一笔审核后的模拟付款登记。","观察是否能区分审核通过与付款登记。"]]};function zi(e){return`<section class="panel prose"><div class="section-intro"><span class="section-mark">◎</span><div><h2>把作品交给用户验证</h2><p>这是待执行的测试计划，没有填入虚构反馈或业务效果数据。</p></div></div><div class="research-summary"><span class="badge s0">待执行</span><span>计划 6 位参与者：员工、主管、财务各 2 位</span><button id="research-export">下载空白记录表 CSV</button></div><h3>${e}任务</h3><p>切换右上角角色可查看其他任务。主持人先不指路，记录行为与原话，需要提示时单独标记。</p><div class="guide-grid">${Bi[e].map(([t,n,r,o])=>`<article class="guide-card"><h3>${t}</h3><p>${r}</p><div class="guide-why">观察重点：${o}</div><button data-guide-role="${e}" data-guide-page="${n}">进入任务场景 →</button></article>`).join("")}</div><h3>统一记录口径</h3><div class="table-wrap"><table><thead><tr><th>指标</th><th>如何记录</th></tr></thead><tbody><tr><td>任务结果</td><td class="wrap-cell">独立完成 / 提示后完成 / 未完成，不合并为成功率。</td></tr><tr><td>输入与用时</td><td class="wrap-cell">号码和金额分别核对；首次模型下载与后续识别耗时分开。</td></tr><tr><td>理解程度</td><td class="wrap-cell">让参与者解释风险原因与下一步，记录原话，不只问是否看懂。</td></tr></tbody></table></div><div class="review-box"><h3>演示前准备</h3>使用虚构样票与独立访客窗口，保留原浏览器记录。首次 OCR 需要网络下载资源；不要把断网时引擎加载失败当成发票无效。记录前征得参与者同意，仅使用匿名代码，不收集真实财务资料。6 人小样本用于发现问题，不能证明总体效率提升。</div></section>`}function Ui(){return"\uFEFF"+[["计划编号（非实际测试）","角色","任务","设备","结果：独立/辅助/未完成","用时秒","首次加载秒","号码错误","金额错误","主持人提示","观察原话"],...["员工","员工","主管","主管","财务","财务"].map((e,t)=>["P0"+(t+1),e,"","","","","","","","",""])].map(e=>e.map(t=>'"'+t+'"').join(",")).join(`\r
`)}function Ji(){return'<section class="panel prose case-study"><div class="case-cover"><span class="case-kicker">PRODUCT CASE STUDY / 个人作品</span><h2>轻报：从报销协作到风险前置</h2><p>面向 200 人成长型企业的费控产品原型</p><div class="case-labels"><span>产品定位与范围取舍</span><span>AI 辅助开发</span><span>场景验证</span></div><button id="print-case" class="primary">打印 / 保存作品案例 PDF</button></div><div class="case-facts"><div><small>目标用户</small><strong>员工 · 主管 · 财务 · 管理员</strong></div><div><small>交付形态</small><strong>可交互网页原型</strong></div><div><small>当前阶段</small><strong>公开演示，尚无真实业务运营</strong></div></div><div class="case-section"><span class="case-step">01 / 问题定义</span><h3>把一个“大而全系统”，缩到一条可验证闭环</h3><p>以中小企业常见的表格和聊天协作为场景假设：员工担心材料不全，主管不知道哪些单据待处理，财务反复核对金额与票据。它们是待验证假设，不代表已经做过用户访谈。</p><div class="case-quote">目标：让一笔报销从提交到付款可追踪，并让明显错误在财务处理之前暴露。</div></div><div class="case-section"><span class="case-step">02 / 产品方案</span><h3>围绕状态流转分配角色职责</h3><div class="case-flow"><span>员工提交</span><b>→</b><span>主管审批</span><b>→</b><span>财务审核</span><b>→</b><span>付款登记</span></div><p>审批中心将报销、费用申请、对公支付与付款任务集中展示，按当前具体人员过滤；处理后自动刷新待办；“我已处理”保留每次具名操作、当时事项和金额，区分处理结果与单据当前状态，并支持分页及筛选结果导出。可按浏览器本地日期回看今天、近7天或自定义范围，导出附带日期范围与时区；本人全部处理次数和当前匹配次数分开呈现。员工报销进度按流转中、待我完善和已登记付款分组，展示提交时路径与当前待处理人，退回后可查看原因并修改重提；付款登记不等于银行到账。组织画布提供 CFO—部门总—员工的可点选图形树，侧栏维护关系，并支持缩放、折叠和添加下级。姓名、岗位或部门搜索可展开祖先路径并定位，避免在大图中反复寻找人员。财务分工模板将财务审核、总账复核和付款责任分开；总账填写科目及核算归属后才进入付款工作台。付款工作台支持清单导出、参考号判重及逐笔核对后的批量模拟登记，一笔校验失败整批不保存，每单独立留痕。组织架构区分部门归属与人员汇报；审批树按金额和费用类型选择分支，再解析直属主管、部门负责人或指定人员。对公业务单独维护供应商、合同及支付单：合同在本浏览器规则初筛，由人阅读全文并复核后才能发起付款，在途与已付共同占用合同额度；提交时固定账户和审批路径，避免档案变化改写在途责任。支持TXT正文及提示证据，不冒充真实AI或法律意见；已接入统一待办、已处理和站内消息；对公合同额度与报销预算仍分别统计。对公新操作保存独立类型及处理时摘要，旧文本不追补，原具名处理人可只读回看重提后的当前单据。报销和对公的规则预审显示触发依据、关联单号和核对建议；补充规则可设提醒或拦截，财务/总账/付款前重新检查，每次处理保留当时规则版本及结果。疑似重复只是线索，不自动认定违规，也不自动批准。票面采集将购销方、号码、日期和金额税额结构化，人工确认后对照财务统一抬头及税号，比对多票合计和跨单重复。票面金额与申请金额分开，不将识别或一致性检查说成税务验真，原件必须显式上传并关联，审核人可从字段卡片预览或下载。报销和对公均可保留发票、验收单等材料，关联后须先解除票面引用才可移除或改类；仅选图识别不保留原件，字段JSON也不包含文件。站内消息按当前人员汇集待办和本人单据进展，已读与业务处理分开，新节点和重提生成新未读；不发送外部推送。提交时固化版本与人员路径，后续组织调整不改写在途记录。管理员可保存草稿、试算路径并填写原因发布。事前费用申请是可选入口：批准后预留额度，关联报销逐笔核销，结束时释放余额。出差申请补充行程，关联报销按交通、住宿和餐补等明细分币合计；示例城市/职级标准对住宿和餐补检查，超标要求说明后人工审核，行程和明细随备份保留。申请进度集中展示当前审批人、额度分解和关联报销，关闭后的未使用金额仍可回顾，但不能继续关联或预留。报销可附酒店水单、行程单等多份证明材料，图片预览、原文件下载及包含文件的备份形成留存闭环；通过单据/文件容量限制及失败回退控制浏览器存储风险。申请额度采用硬校验，部门预算仍是软预警；二者承担不同管控职责。草稿降低一次填完的压力；撤回用于主管审批前纠错，退回用于审批人要求修改；预算明确区分已付款与在途占用，避免把申请金额直接当成实际支出。</p></div><div class="case-section"><span class="case-step">03 / 优先级与取舍</span><h3>先让流程可信，再扩大智能能力</h3><div class="case-priorities"><article><b>P0 · 业务闭环</b><p>创建、审批、退回、付款、状态追踪与数据保留。</p></article><article><b>P1 · 提效与管控</b><p>OCR 辅助录入、透明规则预审、预算预警、关联票据与操作记录。</p></article><article><b>暂缓 · 企业集成</b><p>发票验真、银行支付、真实身份系统、任意嵌套审批与会签及财务软件对接。</p></article></div><p>OCR 只提供候选字段，用户核对后才能应用。确定性规则负责金额与号码检查，付款必须由人明确确认；文本识别、风险提示、审批和真实资金转账保持清晰边界。</p></div><div class="case-section"><span class="case-step">04 / 验证方法</span><h3>区分“代码跑通”和“用户价值成立”</h3><p>已使用业务测试、真实浏览器场景和虚构样票验证功能。它们不能证明报销效率提升或真实用户满意。后续应招募员工、主管、财务各 2 位参与者，记录任务完成率、提交耗时、风险提示理解率与错误操作。</p><p>OCR 使用引擎置信度作为参考，单张样票识别成功不代表通用准确率。验收首先检查原文、候选字段和人工确认流程；任何字段提取失败，都能回到手工填写。</p></div><div class="case-section"><span class="case-step">05 / AI 协作复盘</span><h3>对产品决策负责，而不只展示生成的页面</h3><p>面试可如实介绍：“我确定作品目标和需求边界，借助 AI 实现界面、业务逻辑与测试，并用具体场景检查结果。项目还没有真实客户或运营指标。”复盘应补充你实际做过的取舍、提出过的问题和亲自执行的验证，不编造独立完成的经历。</p><ul><li>成果：可操作的业务闭环、明确的风险提示及可复现的演示路径。</li><li>不足：数据仅在浏览器，角色切换不是身份认证，日志不具备防篡改能力。</li><li>下一步：小样本可用性测试 → 迭代表单与提示 → 再决定是否增加后端和真实集成。</li></ul></div><div class="case-next"><h3>建议面试演示顺序</h3><p>1 分钟介绍问题与范围 → 3 分钟正常报销闭环 → 2 分钟 OCR 与异常票据 → 2 分钟组织与审批配置 → 2 分钟验证计划和能力边界。</p><button id="case-to-guide">进入交互式演示指南 →</button></div></section>'}const ln=e=>String(e??"").replace(/[&<>"']/g,t=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[t]),_i=()=>`<section class="ocr-panel" aria-label="发票图片识别"><div class="ocr-title"><span>✧ 发票图片 OCR</span><span class="badge s1">浏览器本地识别</span></div><p>PNG / JPG / WebP，最大 6 MB；图片不上传。先旋转、裁去无关边缘，再识别并人工核对。首次需下载约 10 MB 资源，不是发票验真。</p><div class="ocr-buttons"><button type="button" id="ocr-star
