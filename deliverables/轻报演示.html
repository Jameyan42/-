`)}function Ur(){return'<section class="panel prose case-study"><div class="case-cover"><span class="case-kicker">PRODUCT CASE STUDY / 个人作品</span><h2>轻报：从报销协作到风险前置</h2><p>面向 200 人成长型企业的费控产品原型</p><div class="case-labels"><span>产品定位与范围取舍</span><span>AI 辅助开发</span><span>场景验证</span></div><button id="print-case" class="primary">打印 / 保存作品案例 PDF</button></div><div class="case-facts"><div><small>目标用户</small><strong>员工 · 主管 · 财务 · 管理员</strong></div><div><small>交付形态</small><strong>可交互网页原型</strong></div><div><small>当前阶段</small><strong>公开演示，尚无真实业务运营</strong></div></div><div class="case-section"><span class="case-step">01 / 问题定义</span><h3>把一个“大而全系统”，缩到一条可验证闭环</h3><p>以中小企业常见的表格和聊天协作为场景假设：员工担心材料不全，主管不知道哪些单据待处理，财务反复核对金额与票据。它们是待验证假设，不代表已经做过用户访谈。</p><div class="case-quote">目标：让一笔报销从提交到付款可追踪，并让明显错误在财务处理之前暴露。</div></div><div class="case-section"><span class="case-step">02 / 产品方案</span><h3>围绕状态流转分配角色职责</h3><div class="case-flow"><span>员工提交</span><b>→</b><span>主管审批</span><b>→</b><span>财务审核</span><b>→</b><span>付款登记</span></div><p>审批中心将报销、费用申请与付款任务集中展示，按当前具体人员过滤；处理后自动刷新待办，支持筛选、搜索、提交时间排序与当前列表导出。组织架构区分部门归属与人员汇报；审批树按金额和费用类型选择分支，再解析直属主管、部门负责人或指定人员。提交时固化版本与人员路径，后续组织调整不改写在途记录。管理员可保存草稿、试算路径并填写原因发布。事前费用申请是可选入口：批准后预留额度，关联报销逐笔核销，结束时释放余额。申请额度采用硬校验，部门预算仍是软预警；二者承担不同管控职责。草稿降低一次填完的压力；撤回用于主管审批前纠错，退回用于审批人要求修改；预算明确区分已付款与在途占用，避免把申请金额直接当成实际支出。</p></div><div class="case-section"><span class="case-step">03 / 优先级与取舍</span><h3>先让流程可信，再扩大智能能力</h3><div class="case-priorities"><article><b>P0 · 业务闭环</b><p>创建、审批、退回、付款、状态追踪与数据保留。</p></article><article><b>P1 · 提效与管控</b><p>OCR 辅助录入、透明规则预审、预算预警、关联票据与操作记录。</p></article><article><b>暂缓 · 企业集成</b><p>发票验真、银行支付、真实身份系统、任意嵌套审批与会签及财务软件对接。</p></article></div><p>OCR 只提供候选字段，用户核对后才能应用。确定性规则负责金额与号码检查，付款必须由人明确确认；文本识别、风险提示、审批和真实资金转账保持清晰边界。</p></div><div class="case-section"><span class="case-step">04 / 验证方法</span><h3>区分“代码跑通”和“用户价值成立”</h3><p>已使用业务测试、真实浏览器场景和虚构样票验证功能。它们不能证明报销效率提升或真实用户满意。后续应招募员工、主管、财务各 2 位参与者，记录任务完成率、提交耗时、风险提示理解率与错误操作。</p><p>OCR 使用引擎置信度作为参考，单张样票识别成功不代表通用准确率。验收首先检查原文、候选字段和人工确认流程；任何字段提取失败，都能回到手工填写。</p></div><div class="case-section"><span class="case-step">05 / AI 协作复盘</span><h3>对产品决策负责，而不只展示生成的页面</h3><p>面试可如实介绍：“我确定作品目标和需求边界，借助 AI 实现界面、业务逻辑与测试，并用具体场景检查结果。项目还没有真实客户或运营指标。”复盘应补充你实际做过的取舍、提出过的问题和亲自执行的验证，不编造独立完成的经历。</p><ul><li>成果：可操作的业务闭环、明确的风险提示及可复现的演示路径。</li><li>不足：数据仅在浏览器，角色切换不是身份认证，日志不具备防篡改能力。</li><li>下一步：小样本可用性测试 → 迭代表单与提示 → 再决定是否增加后端和真实集成。</li></ul></div><div class="case-next"><h3>建议面试演示顺序</h3><p>1 分钟介绍问题与范围 → 3 分钟正常报销闭环 → 2 分钟 OCR 与异常票据 → 2 分钟组织与审批配置 → 2 分钟验证计划和能力边界。</p><button id="case-to-guide">进入交互式演示指南 →</button></div></section>'}var Ve={exports:{}},jt;function Br(){return jt||(jt=1,(function(e){var t=(function(r){var a=Object.prototype,i=a.hasOwnProperty,o=Object.defineProperty||function(c,d,p){c[d]=p.value},n,s=typeof Symbol=="function"?Symbol:{},l=s.iterator||"@@iterator",u=s.asyncIterator||"@@asyncIterator",m=s.toStringTag||"@@toStringTag";function h(c,d,p){return Object.defineProperty(c,d,{value:p,enumerable:!0,configurable:!0,writable:!0}),c[d]}try{h({},"")}catch{h=function(d,p,g){return d[p]=g}}function w(c,d,p,g){var v=d&&d.prototype instanceof C?d:C,L=Object.create(v.prototype),G=new be(g||[]);return o(L,"_invoke",{value:ke(c,p,G)}),L}r.wrap=w;function R(c,d,p){try{return{type:"normal",arg:c.call(d,p)}}catch(g){return{type:"throw",arg:g}}}var O="suspendedStart",N="suspendedYield",M="executing",B="completed",P={};function C(){}function x(){}function J(){}var Z={};h(Z,l,function(){return this});var ae=Object.getPrototypeOf,ee=ae&&ae(ae(ye([])));ee&&ee!==a&&i.call(ee,l)&&(Z=ee);var te=J.prototype=C.prototype=Object.create(Z);x.prototype=J,o(te,"constructor",{value:J,configurable:!0}),o(J,"constructor",{value:x,configurable:!0}),x.displayName=h(J,m,"GeneratorFunction");function de(c){["next","throw","return"].forEach(function(d){h(c,d,function(p){return this._invoke(d,p)})})}r.isGeneratorFunction=function(c){var d=typeof c=="function"&&c.constructor;return d?d===x||(d.displayName||d.name)==="GeneratorFunction":!1},r.mark=fu
