tr><th>指标</th><th>如何记录</th></tr></thead><tbody><tr><td>任务结果</td><td class="wrap-cell">独立完成 / 提示后完成 / 未完成，不合并为成功率。</td></tr><tr><td>输入与用时</td><td class="wrap-cell">号码和金额分别核对；首次模型下载与后续识别耗时分开。</td></tr><tr><td>理解程度</td><td class="wrap-cell">让参与者解释风险原因与下一步，记录原话，不只问是否看懂。</td></tr></tbody></table></div><div class="review-box"><h3>演示前准备</h3>使用虚构样票与独立访客窗口，保留原浏览器记录。首次 OCR 需要网络下载资源；不要把断网时引擎加载失败当成发票无效。记录前征得参与者同意，仅使用匿名代码，不收集真实财务资料。6 人小样本用于发现问题，不能证明总体效率提升。</div></section>`}function At(){return"\uFEFF"+[["计划编号（非实际测试）","角色","任务","设备","结果：独立/辅助/未完成","用时秒","首次加载秒","号码错误","金额错误","主持人提示","观察原话"],...["员工","员工","主管","主管","财务","财务"].map((t,e)=>["P0"+(e+1),t,"","","","","","","","",""])].map(t=>t.map(e=>'"'+e+'"').join(",")).join(`\r
`)}function Tt(){return'<section class="panel prose case-study"><div class="case-cover"><span class="case-kicker">PRODUCT CASE STUDY / 个人作品</span><h2>轻报：从报销协作到风险前置</h2><p>面向 200 人成长型企业的费控产品原型</p><div class="case-labels"><span>产品定位与范围取舍</span><span>AI 辅助开发</span><span>场景验证</span></div><button id="print-case" class="primary">打印 / 保存作品案例 PDF</button></div><div class="case-facts"><div><small>目标用户</small><strong>员工 · 主管 · 财务</strong></div><div><small>交付形态</small><strong>可交互网页原型</strong></div><div><small>当前阶段</small><strong>公开演示，尚无真实业务运营</strong></div></div><div class="case-section"><span class="case-step">01 / 问题定义</span><h3>把一个“大而全系统”，缩到一条可验证闭环</h3><p>以中小企业常见的表格和聊天协作为场景假设：员工担心材料不全，主管不知道哪些单据待处理，财务反复核对金额与票据。它们是待验证假设，不代表已经做过用户访谈。</p><div class="case-quote">目标：让一笔报销从提交到付款可追踪，并让明显错误在财务处理之前暴露。</div></div><div class="case-section"><span class="case-step">02 / 产品方案</span><h3>围绕状态流转分配角色职责</h3><div class="case-flow"><span>员工提交</span><b>→</b><span>主管审批</span><b>→</b><span>财务审核</span><b>→</b><span>付款登记</span></div><p>草稿降低一次填完的压力；撤回用于主管审批前纠错，退回用于审批人要求修改；预算明确区分已付款与在途占用，避免把申请金额直接当成实际支出。</p></div><div class="case-section"><span class="case-step">03 / 优先级与取舍</span><h3>先让流程可信，再扩大智能能力</h3><div class="case-priorities"><article><b>P0 · 业务闭环</b><p>创建、审批、退回、付款、状态追踪与数据保留。</p></article><article><b>P1 · 提效与管控</b><p>OCR 辅助录入、透明规则预审、预算预警、关联票据与操作记录。</p></article><article><b>暂缓 · 企业集成</b><p>发票验真、银行支付、真实身份系统、复杂组织审批及财务软件对接。</p></article></div><p>OCR 只提供候选字段，用户核对后才能应用。确定性规则负责金额与号码检查，付款必须由人明确确认；文本识别、风险提示、审批和真实资金转账保持清晰边界。</p></div><div class="case-section"><span class="case-step">04 / 验证方法</span><h3>区分“代码跑通”和“用户价值成立”</h3><p>已使用业务测试、真实浏览器场景和虚构样票验证功能。它们不能证明报销效率提升或真实用户满意。后续应招募员工、主管、财务各 2 位参与者，记录任务完成率、提交耗时、风险提示理解率与错误操作。</p><p>OCR 使用引擎置信度作为参考，单张样票识别成功不代表通用准确率。验收首先检查原文、候选字段和人工确认流程；任何字段提取失败，都能回到手工填写。</p></div><div class="case-section"><span class="case-step">05 / AI 协作复盘</span><h3>对产品决策负责，而不只展示生成的页面</h3><p>面试可如实介绍：“我确定作品目标和需求边界，借助 AI 实现界面、业务逻辑与测试，并用具体场景检查结果。项目还没有真实客户或运营指标。”复盘应补充你实际做过的取舍、提出过的问题和亲自执行的验证，不编造独立完成的经历。</p><ul><li>成果：可操作的业务闭环、明确的风险提示及可复现的演示路径。</li><li>不足：数据仅在浏览器，角色切换不是身份认证，日志不具备防篡改能力。</li><li>下一步：小样本可用性测试 → 迭代表单与提示 → 再决定是否增加后端和真实集成。</li></ul></div><div class="case-next"><h3>建议面试演示顺序</h3><p>1 分钟介绍问题与范围 → 3 分钟正常报销闭环 → 2 分钟 OCR 与异常票据 → 2 分钟预算与规则取舍 → 2 分钟验证计划和能力边界。</p><button id="case-to-guide">进入交互式演示指南 →</button></div></section>'}var be={exports:{}},Ze;function jt(){return Ze||(Ze=1,(function(t){var e=(function(n){var a=Object.prototype,r=a.hasOwnProperty,o=Object.defineProperty||function(i,s,l){i[s]=l.value},c,d=typeof Symbol=="function"?Symbol:{},p=d.iterator||"@@iterator",q=d.asyncIterator||"@@asyncIterator",b=d.toStringTag||"@@toStringTag";function y(i,s,l){return Object.defineProperty(i,s,{value:l,enumerable:!0,configurable:!0,writable:!0}),i[s]}try{y({},"")}catch{y=function(s,l,h){return s[l]=h}}function k(i,s,l,h){var u=s&&s.prototype instanceof O?s:O,S=Object.create(u.prototype),F=new ie(h||[]);return o(S,"_invoke",{value:ue(i,l,F)}),S}n.wrap=k;function A(i,s,l){try{return{type:"normal",arg:i.call(s,l)}}catch(h){return{type:"throw",arg:h}}}var E="suspendedStart",$="suspendedYield",N="executing",D="completed",C={};function O(){}function M(){}function _(){}var H={};y(H,p,function(){return this});var Q=Object.getPrototypeOf,K=Q&&Q(Q(oe([])));K&&K!==a&&r.call(K,p)&&(H=K);var Y=_.prototype=O.prototype=Object.create(H);M.prototype=_,o(Y,"constructor",{value:_,configurable:!0}),o(_,"constructor",{value:M,configurable:!0}),M.displayName=y(_,b,"GeneratorFunction");function te(i){["next","throw","return"].forEach(function(s){y(i,s,function(l){return this._invoke(s,l)})})}n.isGeneratorFunction=function(i){var s=typeof i=="function"&&i.constructor;return s?s===M||(s.displayName||s.name)==="GeneratorFunction":!1},n.mark=function(i){return Object.setPrototypeOf?Object.setPrototypeOf(i,_):(i.__proto__=_,y(i,b,"GeneratorFunction")),i.prototype=Object.create(Y),i},n.awrap=function(i){return{__await:i}};function re(i,s){function l(S,F,B,W){var U=A(i[S],i,F);if(U.type==="thr
