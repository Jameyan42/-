<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; form-action 'none'; base-uri 'none'"><title>轻报 · 原站点只读备份</title><style>body{font:16px system-ui;color:#21334b;background:#f4f7fb;max-width:850px;margin:40px auto;padding:20px}main{background:white;padding:24px;border-radius:12px}button{padding:12px;background:#2464c8;color:white;border:0;border-radius:6px;cursor:pointer}td,th{text-align:left;padding:10px;overflow-wrap:anywhere}table{width:100%}#status{color:#a33}</style></head><body><main><h1>原站点数据只读备份</h1><p>请从原来使用轻报的同一个域名、同一Chrome配置打开。本工具不加载模拟系统、不写入或删除原数据，也不发起网络上传。备份含原始报销和附件，请妥善保管。</p><p id="origin"></p><table><thead><tr><th>数据键</th><th>字符数</th></tr></thead><tbody id="keys"></tbody></table><p id="status"></p><button id="export">下载所有轻报旧数据JSON</button><p>下载后，在公司业务服务的管理员页面明确映射账号并导入。原审批/付款状态不自动继承；不支持的历史格式仍完整保存在原备份。</p></main><script>
function collect(){return Object.fromEntries(Object.keys(localStorage).filter(k=>k.startsWith('qingbao-')).sort().map(k=>[k,localStorage.getItem(k)]));}
document.querySelector('#origin').textContent='当前来源：'+location.origin;
try{for(const [key,value] of Object.entries(collect())){const row=document.createElement('tr');for(const text of [key,String(value?.length||0)]){const cell=document.createElement('td');cell.textContent=text;row.append(cell);}document.querySelector('#keys').append(row);}}catch{document.querySelector('#status').textContent='浏览器阻止读取本站数据。';}
document.querySelector('#export').onclick=()=>{try{const stores=collect();if(!Object.keys(stores).length)throw Error('当前来源没有轻报旧数据，请确认是原站点和原浏览器配置。');if(JSON.stringify(stores)!==JSON.stringify(collect()))throw Error('其他页面正在修改数据，请稍后重试。');const blob=new Blob([JSON.stringify({schema:1,exportedAt:new Date().toISOString(),sourceOrigin:location.origin,stores},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='qingbao-browser-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.querySelector('#status').textContent='已生成下载；原数据保持不变，请保管含附件的备份。';}catch(e){document.querySelector('#status').textContent=e.message;}};
</script></body></html>
